# Fixed translations of astronomy terms (plans/architecture.md ARC-18). A source text that contains the English
# term must contain one of the listed Turkish stems (lower case; a stem, so that Turkish endings may follow).
# A term ending in * is a stem itself ("plate solv*": plate solve, plate solving); others are whole words.
# Checked by `python tools/translation_review.py glossary` and by tests/test_glossary.py.
# German and Spanish columns come with the translation pass ARC-25. The owner reviews the Turkish column once.

