# Early warning (plans/architecture.md ARC-3): once a week the tests run with the newest versions of every
# dependency instead of the locked ones, on Linux, with Python 3.12 and 3.13. A red run means a new release of a
# dependency changes behaviour; the summary lists the versions that differ from requirements/dev.txt.
name: latest-deps

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  newest:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install --upgrade -e ".[gui,dev]"
      - name: Versions that differ from the lock
        run: |
          pip freeze | sed 's/[-_]/-/g' | tr 'A-Z' 'a-z' | sort > now.txt
          grep -E '^[a-zA-Z0-9]' requirements/dev.txt | sed 's/ ;.*//; s/[-_]/-/g' | tr 'A-Z' 'a-z' | sort > locked.txt
          echo '### Newer than the lock' >> "$GITHUB_STEP_SUMMARY"
          comm -13 locked.txt now.txt | grep -v '^-e ' >> "$GITHUB_STEP_SUMMARY" || true
      - run: python tools/i18n.py
      - run: pytest -q -n auto -o faulthandler_timeout=900
      - name: Known vulnerabilities in the locked set
        run: pip install pip-audit && pip-audit -r requirements/dev.txt || true
