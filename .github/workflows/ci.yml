name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHON_VERSION: "3.12"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - run: python tools/i18n.py
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check . && ruff format --check .
      - name: Brand name only in brand.toml
        run: python tools/check_brand.py
      - run: pytest -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Intel Macs and 64-bit ARM Linux (Raspberry Pi 4/5 and similar observatory computers) too;
        # the ARM build uses Ubuntu 22.04 so it runs on Debian 12 / Raspberry Pi OS (glibc 2.35+).
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # Clean build environment: no test tools in the bundle
      - run: pip install ".[gui,build]"
      - name: No copyleft libraries in the bundle
        run: python tools/check_licenses.py
      - run: python packaging/build.py
      - name: Install and smoke-test the installer (Phase 0 gate)
        run: python packaging/smoke_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          path: |
            packaging/out/*.AppImage
            packaging/out/*.exe
            packaging/out/*.dmg
          if-no-files-found: error

  # The Linux AppImage is built on Ubuntu 22.04; check it starts on other distributions too.
  linux-distros:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04", "fedora:latest", "archlinux:latest"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Desktop libraries a normal installation already has
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 libegl1 libgl1 libxkbcommon0 \
              libfontconfig1 libdbus-1-3 libglib2.0-0 mesa-vulkan-drivers
          elif command -v dnf >/dev/null; then
            dnf install -y python3 mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs glib2 mesa-vulkan-drivers
          else
            pacman -Syu --noconfirm python mesa libglvnd libxkbcommon fontconfig dbus glib2 vulkan-swrast
          fi
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: installer-Linux-X64
          path: packaging/out
      - name: Run the AppImage smoke test
        run: python3 packaging/smoke_installed.py

  # Windows installer built on the latest image; also check an older Windows build.
  windows-versions:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: installer-Windows-X64
          path: packaging/out
      - run: python packaging/smoke_installed.py

  # Science validation on real, public data (see tests/validation)
  validation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - name: HAT-P-32 b transit (EXOTIC sample data)
        run: git clone --depth 1 https://github.com/rzellem/EXOTIC_sampledata ../validation-data
      - run: pytest -v tests/validation
        env:
          ASTROWB_VALIDATION_DATA: ../validation-data

  # Device control against the real INDI simulator drivers
  indi-simulators:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y indi-bin libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"  # pytest-qt in dev needs PySide6
      - run: pytest -v tests/test_indi_simulators.py -rs

  # A tag v<version> publishes the tested installers as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, linux-distros, windows-versions, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the version in the code
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/astrowb/__init__.py)"
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |  # the release may already exist when it was drafted on GitHub's Releases page
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
