# The validation data sets (plans/validation.md VAL-1): where each comes from and the exact files the checks use.
# `python tools/fetch_data.py <id> | --area <area> | --all` downloads them into data/<id>/ (or $ASTROWB_DATA/<id>/)
# and checks the SHA-256 written here; `--record` writes the checksums of verified downloads. The SOURCE.md
# beside each set stays the human note (licence, citation, use); tests/test_data_registry.py keeps both in step.
# source: "lco" (LCO archive, by file name), "url" (base + file name), "archive" (a tar file, members by name),
# "manual" (an account or a form is needed: the SOURCE.md says how).

